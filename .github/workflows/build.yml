name: build

on:
  push:
  pull_request:
  workflow_dispatch:


# GT3 Revisited for Apple TV: the unit tests on macOS, and the Apple TV app built for devices,
# unsigned (each player's copy is built and signed on their own Mac by the installer).
#
# CI publishes nothing: releases are made on the maintainer's Mac by tools/release.sh
# (docs/release.md), which tags, signs, notarizes and creates the GitHub Release. So no job runs
# on tags, and no signing secret is stored in GitHub.
#
# SDL and zlib are fetched by CMake (cmake/Dependencies.cmake). Shaders are compiled offline and
# committed (src/render/shaders/generated), so no shader tools are needed here.

jobs:
  # The game's engine and its unit tests that need no disc image.
  tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build tests
        run: cmake --build build --config Release --parallel 4 --target gt3r_tests
      - name: Unit tests (no disc image)
        run: ctest --test-dir build -C Release --output-on-failure

  # Apple TV (docs/dev/PLATFORMS.md "tvOS"): no signing without GT3R_IOS_TEAM, so no artifact
  # (an unsigned app installs nowhere).
  tvos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-tvos -G Xcode -DCMAKE_SYSTEM_NAME=tvOS -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
      - name: Build app (unsigned)
        run: cmake --build build-tvos --config Release --target gt3r -- -quiet
